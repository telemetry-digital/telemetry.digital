; Compile check for the Arduino port: `pio run -d ci` builds the fridge_node example for ESP32-S3.
; The ESP-IDF port: `pio run -d ci/espidf` (or idf.py in examples/esp-idf/fridge_node).
[platformio]
src_dir = ..
default_envs = arduino_s3

[env:arduino_s3]
platform = espressif32@^6
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = -<*> +<src/*.c> +<ports/arduino/*.cpp> +<ci/gen/*.cpp>
extra_scripts = pre:extra_include.py
lib_deps = knolleary/PubSubClient@^2.8
