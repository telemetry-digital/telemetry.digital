; Compile check for the ESP-IDF port without a local ESP-IDF install: PlatformIO downloads the framework and the
; toolchain and builds examples/esp-idf/fridge_node for ESP32-S3.
;   pio run -d ci/espidf
[platformio]
default_envs = espidf_s3

[env:espidf_s3]
platform = espressif32@^6
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
