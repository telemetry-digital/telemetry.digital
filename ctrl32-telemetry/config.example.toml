# ctrl32 telemetry — example configuration (copy to config.toml)
# Default locations: Linux /etc/ctrl32-telemetry/config.toml, Windows %ProgramData%\ctrl32-telemetry\config.toml
# Every key can be overridden by an environment variable CTRL32_<SECTION>_<KEY>, e.g. CTRL32_DB_URL.

# "intranet": TLS optional, MFA for admins. "internet": TLS mandatory for HTTP and MQTT, MFA for everyone.
profile = "intranet"

[http]
listen = ":8080"
base_url = "http://localhost:8080"
# tls_cert = "/etc/ctrl32-telemetry/tls/fullchain.pem"
# tls_key  = "/etc/ctrl32-telemetry/tls/privkey.pem"
public_read = true   # PoC/demo only: unauthenticated read-only API

[mqtt]
listen = ":1883"      # plain TCP (intranet profile only)
# tls_listen = ":8883"
ws_listen = ":1884"   # MQTT over WebSocket for the UI

[db]
url = "postgres://ctrl32_app:change-me@localhost:5433/ctrl32?sslmode=disable"
admin_url = "postgres://ctrl32:ctrl32-dev-only@localhost:5433/ctrl32?sslmode=disable"
app_password = "change-me"   # `migrate` sets this password on the ctrl32_app role

[smtp]
# host = "smtp.example.com"
port = 587
# user = ""
# password = ""
# from = "ctrl32-telemetry@example.com"
# to = ["alarms@example.com"]

[log]
level = "info"
# file = "/var/log/ctrl32-telemetry/server.log"
# syslog = "udp://siem.example.com:514"   # forward the JSON log as RFC 5424 (udp:// or tcp://)

[gap]
check_interval = "1m"

[time]
# Clock check against NTP (SNTP) at start and every check_interval; shown on the Server page, in /healthz and /metrics.
# ntp_server = "pool.ntp.org"   # empty = no check; on an intranet point it at your own time server
# check_interval = "15m"
# max_offset = "1s"

[security]
# Secrets that never enter the database. Generated by the installer; at least 16 random characters each.
# Changing the pepper invalidates all passwords; changing secret_key makes stored TOTP seeds unreadable.
pepper = "REPLACE-WITH-RANDOM-32-CHARS"
secret_key = "REPLACE-WITH-RANDOM-32-CHARS"
# contact = "mailto:security@example.com"   # published in /.well-known/security.txt (RFC 9116)

[report]
# PDF reports and exports are rendered with the Typst CLI (Apache-2.0, pinned release; the installer downloads it).
# Empty typst_path = "typst" on PATH or next to the binary. Without Typst the server runs, PDF endpoints return 503.
# typst_path = "/usr/local/bin/typst"
# storage_dir = "/var/lib/ctrl32-telemetry/reports"   # generated PDFs are records (hash verified on download)

[video]
# Camera recordings (spec 010): one-minute MP4 files per camera; the oldest are deleted beyond max_disk_gb.
# storage_dir = "/var/lib/ctrl32-telemetry/video"   # default: next to the reports directory
# max_disk_gb = 50
# Remote cameras (spec 011): relays at remote sites (ctrl32-telemetry camera-relay) send video here over RTSPS.
# push_listen = ":8322"          # open this TCP port in the firewall; empty = off
# push_tls_cert = ""             # default http.tls_cert; profile "internet" requires TLS
# push_tls_key = ""
# push_host = "telemetry.example.com"   # name the relays connect to; default the host of http.base_url

[analytics]
# Object counting on camera pictures (spec 029, ADR-0022, docs/object-counting.md): people and vehicles crossing lines
# drawn on the picture, counted by a worker process per camera. Needs an unmodified ffmpeg (LGPL build), the ONNX
# Runtime library (MIT, 1.17+) and the YOLOX models (Apache-2.0); without them counting with sensors still works.
# ffmpeg = "/usr/bin/ffmpeg"                                   # empty = next to the binary or on PATH
# onnxruntime = "/opt/onnxruntime/lib/libonnxruntime.so"       # Windows: C:\onnxruntime\lib\onnxruntime.dll
# model_nano = "/var/lib/ctrl32-telemetry/models/yolox_nano.onnx"
# model_tiny = "/var/lib/ctrl32-telemetry/models/yolox_tiny.onnx"
# nano_sha256 = "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d"
# tiny_sha256 = "427cc366d34e27ff7a03e2899b5e3671425c262ea2291f88bb942bc1cc70b0f7"
# threads = 1          # inference threads per camera
# max_cameras = 4      # cameras analysed at the same time

[license]
# White labeling is unlocked by the ctrl32 licence bought on ctrl32.com (99,- EUR, once; it unlocks either the ctrl32
# editor or white labeling on one server). System → License → "Activate with the order number" sends the order number
# and the host name of http.base_url to the licence service and installs the license it returns (docs/whitelabel.md).
# activation_url = "https://lic.ctrl32.com/telemetry/activate"   # https only (http just to 127.0.0.1 for tests)
# buy_url = "https://ctrl32.com/pricing/"

[fota]
# Uploaded firmware images (records; devices download them with their own token, Range supported).
# storage_dir = "/var/lib/ctrl32-telemetry/firmware"
# max_size_mb = 16

[agent]
# Privileged helper for the Server page (restart, Caddy, WireGuard, backups, updates; ADR-0012). The installer
# starts it as a second service and fills in the socket; empty = no agent (development).
# socket = "/run/ctrl32-telemetry/agent.sock"       # Windows: C:\ProgramData\ctrl32-telemetry\agent.sock
# pg_dump = "C:\Program Files\PostgreSQL\18\bin\pg_dump.exe"   # Windows backups (default: bundled PostgreSQL)
# pg_container = "ctrl32-telemetry-postgres"        # backups through the Docker container (Linux default)
# update_url = "https://portal.telemetry.digital/dl"       # where updates are downloaded from (SHA256SUMS verified)

[map]
# Self-hosted map tiles for the map widgets (ADR-0014): a raster PMTiles v3 archive (png/jpg/webp) served by this
# server at /tiles/{z}/{x}/{y}.png, so maps work without the Internet. Used whenever the organization has no tile URL
# of its own; without it the built-in OpenStreetMap tiles remain (light use only). Convert MBTiles with
# `pmtiles convert map.mbtiles map.pmtiles` (go-pmtiles) or try the sample from https://portal.telemetry.digital/dl/sample.pmtiles.
# pmtiles = "/var/lib/ctrl32-telemetry/map.pmtiles"
# attribution = "© OpenStreetMap contributors"
