<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e30613">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>.box { max-width: 400px; margin: 32px auto; } .box h1 { font-size: 1.2em; }</style>
</head>
<body>
<header class="topbar"></header>
<main class="container">
<form id="f" class="card box form">
  <h1>Forgot password</h1>
  <p class="muted">Enter your username or e-mail. If the account has an e-mail address and the server can send mail, you will receive a link that is valid for one hour.</p>
  <label>Username or e-mail <input name="login" required autofocus autocomplete="username"></label>
  <div class="err" id="err"></div>
  <button class="btn primary" type="submit">Send reset link</button>
  <div id="done" hidden class="muted"></div>
  <p style="text-align:center;font-size:14px;margin:4px 0 0"><a href="/login">Back to sign in</a></p>
</form>
</main>
<script src="/app.js"></script>
<script>
ctrl32.ready();
document.querySelector('#f').onsubmit = async e => { e.preventDefault(); const f = e.target; const err = document.querySelector('#err'); err.textContent='';
  try{ const r = await ctrl32.api('POST','/api/v1/auth/forgot',{login: f.login.value}); f.querySelector('button').hidden = true;
    document.querySelector('#done').hidden = false;
    document.querySelector('#done').textContent = r.mail_configured ? 'If the account exists and has an e-mail address, the link is on its way.' : 'This server cannot send e-mail. Ask your administrator to reset the password.'; }
  catch(x){ err.textContent = x.message; } };
</script>
</body>
</html>
