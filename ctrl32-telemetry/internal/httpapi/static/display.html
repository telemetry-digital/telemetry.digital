<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="kiosk">
<main>
  <section id="pair" hidden>
    <div class="kiosk-pair">
      <div class="kiosk-logo" id="logo"></div>
      <h1>Pair this display</h1>
      <p>In ctrl32 open <b>Displays</b>, choose <b>Pair display</b> and enter this code:</p>
      <div class="kiosk-code notranslate" id="code">····-····</div>
      <p class="muted" id="codeInfo"></p>
      <p class="muted" style="font-size:13px">The display then shows only what it is given and cannot change anything. An administrator can disconnect it at any time.</p>
    </div>
  </section>
  <div id="stage" class="kiosk-stage" hidden></div>
  <div id="overlay" class="kiosk-overlay" hidden></div>
  <div id="ident" class="kiosk-ident" hidden></div>
  <div id="msg" class="kiosk-msg" hidden><div class="kiosk-msg-text notranslate"></div><div class="kiosk-msg-by"></div></div>
  <div class="kiosk-status" id="status" hidden></div>
  <div class="kiosk-title" id="title"></div>
</main>
<script src="/app.js"></script>
<script src="/scada.js"></script>
<script src="/vendor/tabler-icons.js"></script>
<script src="/widgets.js"></script>
<script src="/widgets-more.js"></script>
<script src="/widgets-counting.js"></script>
<script src="/trend.js"></script>
<script src="/widgets-trend.js"></script>
<script src="/videoplayer.js"></script>
<script>
// A kiosk (spec 014): paired once with a code, then shows its dashboards, process screens and video wall screens in
// turn, enlarges cameras with events, and follows the operator's commands. It never needs a user session.
const $ = s => document.querySelector(s), esc = ctrl32.esc, t = ctrl32.t;
let STATE = null, VERSION = null, IDX = 0, rotateT = null, refreshFn = null, refreshT = null, players = [], lastCmd = 0, pollT = null;
let popups = new Map(); // camera id → {player, until}
const api = async (m, url, body) => {
  const r = await fetch(url, {method: m, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin', cache: 'no-store'});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || 'HTTP ' + r.status); e.status = r.status; throw e; }
  return data;
};

// ---- pairing ----
let codeKnown = false, pairT = null;
async function hello() {
  try {
    const r = await api('POST', '/api/v1/display/hello', {code_known: codeKnown});
    if (r.paired) { $('#pair').hidden = true; clearTimeout(pairT); start(); return; }
    if (r.code) { $('#code').textContent = r.code; codeKnown = true; }
    $('#pair').hidden = false; $('#stage').hidden = true;
    const left = Math.max(0, Math.round((new Date(r.expires_at) - Date.now()) / 60000));
    $('#codeInfo').textContent = `${t('The code is valid for')} ${left} min.`;
  } catch (x) { codeKnown = false; $('#codeInfo').textContent = x.message; }
  pairT = setTimeout(hello, 3000);
}

// ---- content ----
function stopContent() {
  closeRec();
  if (big) enlarge(big.el);
  for (const p of players) p.close(); players = [];
  clearInterval(refreshT); refreshT = null; refreshFn = null;
  $('#stage').innerHTML = '';
}
async function showItem(it) {
  stopContent();
  const st = $('#stage'); st.hidden = false;
  $('#title').textContent = it.title || '';
  if (it.kind === 'dashboard') {
    const wrap = document.createElement('div'); wrap.className = 'kiosk-dash'; st.appendChild(wrap);
    const box = document.createElement('div'); wrap.appendChild(box);
    ctrl32Widgets.setPublic('~' + it.slug);
    const d = await api('GET', `/api/v1/public/${encodeURIComponent('~' + it.slug)}`);
    fitGrid(d.spec, box);
    refreshFn = await ctrl32Widgets.render(box, d.spec, {range: d.spec.range || '6h'});
    FITTED = {box, spec: d.spec};
    refreshT = setInterval(() => refreshFn && refreshFn(), Math.max(5, d.spec.refresh_s || 30) * 1000);
  } else if (it.kind === 'wall') {
    const w = await api('GET', `/api/v1/display/walls/${encodeURIComponent(it.wall)}`);
    const sc = w.screens[it.screen] || w.screens[0];
    const g = document.createElement('div'); g.className = 'wall-grid'; st.appendChild(g);
    g.style.gridTemplateColumns = `repeat(${sc.cols}, 1fr)`; g.style.gridTemplateRows = `repeat(${sc.rows}, 1fr)`;
    const quality = sc.quality === 'main' || sc.quality === 'sub' ? sc.quality : sc.cols * sc.rows > (w.sub_stream_above ?? 4) ? 'sub' : 'main';
    // tiles may span several cells (0.85.0)
    g.innerHTML = ctrl32Player.wallPlace(sc).map(r => {
      const name = r.id && w.cameras[r.id];
      return `<div class="cell" style="${ctrl32Player.wallArea(r)}" ${name ? `data-id="${esc(r.id)}"` : ''}>${name ? `<div class="cap"><span class="cam-dot"></span><span class="notranslate">${esc(name)}</span></div>` : ''}</div>`;
    }).join('');
    for (const el of g.querySelectorAll('.cell[data-id]')) {
      const dot = el.querySelector('.cam-dot');
      const p = ctrl32Player(el, {url: `/api/v1/display/cameras/${el.dataset.id}/live?quality=${quality}`, live: true,
        onState: s => { dot.className = 'cam-dot ' + (s === 'online' ? 'online' : s === 'offline' ? 'offline' : ''); }});
      p.camera = el.dataset.id;
      el.prepend(p.el); players.push(p);
      el.onclick = () => enlarge(el, w.cameras[el.dataset.id]);
      el.title = t('Click: enlarge');
    }
    markActive();
  }
}
// A click enlarges a tile to the whole screen with the main stream of a camera the display already shows; another click
// or Esc returns, and so does the time limit, so a forgotten camera does not keep the rest of the wall hidden. A display
// has no user, so it offers no recordings.
const ENLARGE_MS = 5 * 60 * 1000;
let big = null, bigT = null;
function enlarge(el, name) {
  clearTimeout(bigT);
  if (big) { big.p.close(); big.bar.remove(); big.el.classList.remove('max'); const was = big.el; big = null; if (was === el) return; }
  el.classList.add('max');
  const p = ctrl32Player(el, {url: `/api/v1/display/cameras/${el.dataset.id}/live?quality=main`, live: true});
  p.el.style.position = 'absolute'; p.el.style.inset = '0'; p.el.style.zIndex = '1';
  const bar = document.createElement('div'); bar.className = 'wall-max-bar';
  bar.innerHTML = `<span class="notranslate wall-max-name">${esc(name || '')}</span>${STATE && STATE.playback ? `<button class="btn small" type="button" data-rec>${esc(t('Recordings'))}</button>` : ''}<button class="btn small" type="button" data-back>${esc(t('Back to the wall'))} (Esc)</button>`;
  bar.onclick = e => e.stopPropagation();
  bar.querySelector('[data-back]').onclick = () => enlarge(el);
  const recBtn = bar.querySelector('[data-rec]'); if (recBtn) recBtn.onclick = () => openRec(el.dataset.id, name);
  el.appendChild(bar);
  big = {el, p, bar};
  bigT = setTimeout(() => { if (big) enlarge(big.el); }, ENLARGE_MS);
}
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (rec) closeRec(); else if (big) enlarge(big.el); });
// Recordings of an enlarged camera, on a display with the option (0.86.11): watching only. The wall goes on behind them,
// and nobody looking at them for a while returns the display to the wall.
const REC_IDLE_MS = 15 * 60 * 1000, DAY_MS = 24 * 3600 * 1000;
let rec = null;
function closeRec() {
  if (!rec) return;
  clearTimeout(rec.idle); rec.player.close(); rec.el.remove(); rec = null;
}
function openRec(id, name) {
  closeRec();
  if (big) enlarge(big.el);
  const el = document.createElement('div'); el.className = 'kiosk-rec';
  el.innerHTML = `<div class="kiosk-rec-bar"><b class="notranslate">${esc(name || '')}</b>
    <button class="btn small" type="button" data-day="-1" aria-label="previous day">‹</button><input type="date" data-date><button class="btn small" type="button" data-day="1" aria-label="next day">›</button>
    <span class="grow"></span><span class="notranslate" data-clock></span><span class="grow"></span>
    <button class="btn small" type="button" data-skip="-60">« 60</button><button class="btn small" type="button" data-skip="-10">« 10</button><button class="btn small" type="button" data-pause>❚❚</button><button class="btn small" type="button" data-skip="10">10 »</button><button class="btn small" type="button" data-skip="60">60 »</button>
    <button class="btn small" type="button" data-speed="1">1×</button><button class="btn small" type="button" data-speed="4">4×</button><button class="btn small" type="button" data-speed="16">16×</button>
    <button class="btn small" type="button" data-close>${esc(t('Back to the wall'))} (Esc)</button></div>
    <div class="kiosk-rec-pic"></div><div class="kiosk-rec-tl"><div class="tl"></div><div class="tl-ax"></div><div class="muted" data-info></div></div>`;
  document.body.appendChild(el);
  const q = s => el.querySelector(s), tl = q('.tl');
  const local = ms => { const x = new Date(ms); return new Date(ms - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const startOf = ms => { const x = new Date(ms); x.setHours(0, 0, 0, 0); return x.getTime(); };
  const r = {el, idle: null, day: startOf(Date.now()), spans: [], cur: null, paused: false, speed: 1};
  const draw = () => {
    const w = ms => Math.min(1, Math.max(0, (ms - r.day) / DAY_MS)) * 100;
    tl.innerHTML = r.spans.filter(([a, b]) => b > r.day && a < r.day + DAY_MS).map(([a, b]) => `<div class="span" style="left:${w(a)}%;width:${Math.max(0.15, w(b) - w(a))}%"></div>`).join('') +
      (r.cur !== null && r.cur >= r.day && r.cur < r.day + DAY_MS ? `<div class="cur" style="left:${w(r.cur)}%"></div>` : '');
  };
  const play = ms => {
    r.cur = Math.min(ms, Date.now() - 5000); r.paused = false; q('[data-pause]').textContent = '❚❚'; q('[data-info]').textContent = '';
    r.player.rate(r.speed);
    r.player.open(`/api/v1/display/cameras/${encodeURIComponent(id)}/playback?from=${new Date(r.cur).toISOString()}&speed=${r.speed}`, false);
    for (const b of el.querySelectorAll('[data-speed]')) b.classList.toggle('primary', +b.dataset.speed === r.speed);
    draw();
  };
  const load = async start => {
    q('[data-date]').value = local(r.day);
    try {
      const s = await api('GET', `/api/v1/display/cameras/${encodeURIComponent(id)}/recordings?from=${new Date(r.day).toISOString()}&to=${new Date(r.day + DAY_MS).toISOString()}`);
      r.spans = s.spans.map(x => [Date.parse(x.from), Date.parse(x.to)]);
      q('[data-info]').textContent = r.spans.length ? '' : t('No recording on this day');
      draw();
      if (start && r.spans.length) play(start(r.spans));
    } catch (x) { q('[data-info]').textContent = x.message; }
  };
  r.player = ctrl32Player(q('.kiosk-rec-pic'), {url: '', live: false, zoom: true,
    onTime: ms => { r.cur = ms; q('[data-clock]').textContent = new Date(ms).toLocaleString(document.documentElement.lang || undefined); draw(); },
    onEnd: () => { q('[data-info]').textContent = t('End of the recording'); }});
  q('.kiosk-rec-pic').appendChild(r.player.el);
  const awake = () => { clearTimeout(r.idle); r.idle = setTimeout(closeRec, REC_IDLE_MS); };
  el.addEventListener('pointerdown', awake); el.addEventListener('keydown', awake); el.addEventListener('contextmenu', e => e.preventDefault());
  q('[data-close]').onclick = closeRec;
  q('[data-pause]').onclick = () => { if (r.cur === null) return; if (r.paused) { play(r.cur); return; } r.paused = true; r.player.pause(); q('[data-pause]').textContent = '▶'; };
  for (const b of el.querySelectorAll('[data-skip]')) b.onclick = () => { if (r.cur !== null) play(r.cur + +b.dataset.skip * 1000); };
  for (const b of el.querySelectorAll('[data-speed]')) b.onclick = () => { r.speed = +b.dataset.speed; if (r.cur !== null) play(r.cur); };
  for (const b of el.querySelectorAll('[data-day]')) b.onclick = () => { r.day = startOf(r.day + 12 * 3600 * 1000 + +b.dataset.day * DAY_MS); load(s => s[0][0]); };
  q('[data-date]').onchange = e => { if (e.target.value) { r.day = startOf(new Date(e.target.value + 'T12:00:00').getTime()); load(s => s[0][0]); } };
  tl.onclick = e => { const b = tl.getBoundingClientRect(); play(r.day + Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)) * DAY_MS); };
  q('.tl-ax').innerHTML = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(h => `<span style="left:${h / 24 * 100}%">${String(h).padStart(2, '0')}:00</span>`).join('');
  rec = r; awake();
  // starts a few minutes before the newest recording of today
  load(s => Math.max(s[s.length - 1][1] - 5 * 60000, s[s.length - 1][0]));
}
// a wall never scrolls: a grid dashboard gets the row height that fills the screen (process screens scale themselves)
let FITTED = null;
function fitGrid(spec, box) {
  if (spec.layout && spec.layout.type === 'canvas') {
    // a process screen scales with its width: give it the width at which its height fits the screen too
    const W = spec.layout.width || 1600, H = spec.layout.height || 900;
    box.style.width = Math.min(innerWidth - 24, (innerHeight - 24) * W / H) + 'px'; box.style.margin = '0 auto'; box.style.position = 'relative'; box.style.inset = 'auto';
    return;
  }
  if (!spec.layout || !(spec.widgets || []).length) return;
  const rows = Math.max(...spec.widgets.map(w => (w.geometry.y || 0) + (w.geometry.h || 1)));
  spec.layout.row_height = Math.max(36, Math.floor((innerHeight - 24 - 12 * (rows - 1)) / rows));
}
let resizeT = null;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(async () => {
  if (!FITTED || !FITTED.box.isConnected) return; fitGrid(FITTED.spec, FITTED.box); refreshFn = await ctrl32Widgets.render(FITTED.box, FITTED.spec, {range: FITTED.spec.range || '6h'}); }, 400); });
function rotate() {
  clearTimeout(rotateT);
  const items = STATE.items;
  if (!items.length) { stopContent(); $('#stage').innerHTML = `<div class="kiosk-empty">${esc(STATE.name)}<br><span class="muted">${esc(t('Nothing to show'))}</span></div>`; $('#stage').hidden = false; return; }
  IDX = IDX % items.length;
  const it = items[IDX];
  showItem(it).catch(x => { $('#stage').innerHTML = `<div class="kiosk-empty">${esc(x.message)}</div>`; });
  // the turn waits for an enlarged camera
  const next = () => { if (big || rec) { rotateT = setTimeout(next, 5000); return; } IDX++; rotate(); };
  if (items.length > 1) rotateT = setTimeout(next, (it.seconds || 60) * 1000);
}
function markActive() {
  for (const el of document.querySelectorAll('.wall-grid .cell[data-id]')) {
    const a = STATE.active[el.dataset.id];
    el.classList.toggle('cam-alert', !!a); el.dataset.active = a ? a.kinds.map(k => t(k)).join(', ') : '';
  }
}

// ---- overlays: cameras with events and cameras sent by an operator ----
function renderOverlay() {
  const now = Date.now();
  for (const [id, p] of popups) if (p.until < now) { p.player.close(); p.el.remove(); popups.delete(id); }
  const ov = $('#overlay');
  if (!popups.size) { ov.hidden = true; ov.innerHTML = ''; return; }
  ov.hidden = false;
  const n = popups.size, cols = n === 1 ? 1 : 2;
  ov.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  for (const [id, p] of popups) if (!p.el.isConnected) ov.appendChild(p.el);
}
function popup(id, name, label, seconds, quality) {
  const until = Date.now() + seconds * 1000;
  const cur = popups.get(id);
  if (cur) { cur.until = Math.max(cur.until, until); cur.el.querySelector('.kiosk-pop-label').textContent = label; renderOverlay(); return; }
  if (popups.size >= 4) { const [oldest] = popups.keys(); popups.get(oldest).player.close(); popups.get(oldest).el.remove(); popups.delete(oldest); }
  const el = document.createElement('div'); el.className = 'kiosk-pop';
  el.innerHTML = `<div class="kiosk-pop-head"><b class="notranslate">${esc(name || '')}</b><span class="kiosk-pop-label">${esc(label)}</span></div>`;
  const player = ctrl32Player(el, {url: `/api/v1/display/cameras/${encodeURIComponent(id)}/live?quality=${quality || 'main'}`, live: true});
  el.appendChild(player.el);
  popups.set(id, {player, el, until});
  renderOverlay();
}
let wasActive = {};
function handleEvents() {
  if (STATE.popup !== 'none') {
    for (const [id, a] of Object.entries(STATE.active)) {
      if (!a.popup) continue;
      if (!wasActive[id]) popup(id, a.name, a.kinds.map(k => t(k)).join(', '), STATE.popup_seconds || 30, 'main');
      else if (popups.has(id)) popups.get(id).until = Math.max(popups.get(id).until, Date.now() + (STATE.popup_seconds || 30) * 1000);
    }
  }
  wasActive = STATE.active;
}
// A command counts only when it was issued after this page loaded: seq is the server's time of the command (ns), the
// page's load time is taken on the server's clock (server_time of the state), so a skewed PC clock does not matter.
// The newest command handled is kept for the tab, so a reload never handles its own command again (0.85.1: the first
// command a display ever got — e.g. Reload after an update — used to be dropped).
let clockSkew = 0; // server clock − this PC's clock, ms
function handleCommand(c) {
  if (!c || c.seq <= lastCmd) return;
  lastCmd = c.seq;
  try { sessionStorage.setItem('ctrl32.display.cmd', String(c.seq)); } catch (x) { /* ignore */ }
  if (c.seq / 1e6 < performance.timeOrigin + clockSkew - 2000) return; // issued before this page loaded
  const secs = Math.max(1, (new Date(c.until) - Date.now()) / 1000);
  if (c.action === 'camera') popup(c.camera, c.name, `${t('sent by')} ${c.by}`, secs, c.quality);
  else if (c.action === 'identify') { const el = $('#ident'); el.innerHTML = `<div>${esc(STATE.name)}</div><small>${esc(t('This display'))}</small>`; el.hidden = false; setTimeout(() => { el.hidden = true; }, secs * 1000); }
  else if (c.action === 'reload') location.reload();
  else if (c.action === 'clear') { for (const p of popups.values()) p.player.close(); popups.clear(); renderOverlay(); $('#ident').hidden = true; }
}

// announcements: info and warning as a band, alarm over the whole screen (text only, never HTML)
function handleMessage(m) {
  const el = $('#msg');
  if (!m || new Date(m.until) < Date.now()) { el.hidden = true; return; }
  el.className = 'kiosk-msg ' + m.level; el.hidden = false;
  el.querySelector('.kiosk-msg-text').textContent = m.text;
  el.querySelector('.kiosk-msg-by').textContent = `${m.by} · ${new Date(m.seq / 1e6).toLocaleTimeString(document.documentElement.lang || undefined)}`;
}

// ---- state ----
async function poll() {
  clearTimeout(pollT);
  try {
    const t0 = Date.now(), s = await api('GET', '/api/v1/display/state');
    $('#status').hidden = true;
    if (s.server_time) clockSkew = Date.parse(s.server_time) - (t0 + Date.now()) / 2;
    checkServerVersion(s.server_version);
    // switch only to a language the server has enabled (otherwise the page would reload forever)
    if (s.locale && s.locale !== ctrl32.locale && (ctrl32.langs.enabled || []).includes(s.locale)) { ctrl32.setLocale(s.locale); return; }
    STATE = s; window.ctrl32DisplayCameras = s.cameras || {}; window.ctrl32DisplayActive = s.active || {};
    if (rec && !s.playback) closeRec(); // the option was switched off
    document.title = s.name;
    if (s.version !== VERSION) { VERSION = s.version; IDX = 0; rotate(); }
    markActive(); handleEvents(); handleCommand(s.command); handleMessage(s.message); renderOverlay();
  } catch (x) {
    if (x.status === 401) { stopContent(); STATE = null; VERSION = null; codeKnown = false; hello(); return; }
    $('#status').hidden = false; $('#status').textContent = t('Connection to the server lost — retrying…');
  }
  pollT = setTimeout(poll, 4000);
}
// After a server update the page reloads itself (new page and scripts): 0–30 s later, so many displays do not all
// come at once; at most once in 10 minutes per tab, so a server that flips between versions cannot loop it.
let serverVersion = null, updateT = null;
function checkServerVersion(v) {
  if (!v) return;
  if (serverVersion === null) { serverVersion = v; return; }
  if (v === serverVersion || updateT) return;
  let last = 0;
  try { last = +(sessionStorage.getItem('ctrl32.display.updated') || 0); } catch (x) { /* ignore */ }
  if (Date.now() - last < 10 * 60 * 1000) return;
  const go = () => {
    if (big || rec) { updateT = setTimeout(go, 30000); return; } // not under someone looking at a camera or a recording
    try { sessionStorage.setItem('ctrl32.display.updated', String(Date.now())); } catch (x) { /* ignore */ }
    location.reload();
  };
  updateT = setTimeout(go, Math.random() * 30000);
}
// What this display shows, for the Displays screen (0.86.0): every camera tile with its state and since when, the
// screen and the page version; the kiosk launcher names its PC and monitor in the address (?kiosk=…&monitor=…).
const tileSince = new Map(); // camera → {state, at}
async function reportHealth() {
  if (!STATE) return;
  const now = Date.now(), tiles = [];
  for (const p of players) {
    if (!p.camera || !p.el.isConnected) continue;
    const st = p.health, prev = tileSince.get(p.camera);
    if (!prev || prev.state !== st) tileSince.set(p.camera, {state: st, at: now});
    tiles.push({camera: p.camera, state: st, since_s: Math.round((now - tileSince.get(p.camera).at) / 1000)});
  }
  const q = new URLSearchParams(location.search), mon = parseInt(q.get('monitor'), 10);
  const body = {page_version: serverVersion || '', item: $('#title').textContent || '', tiles,
    screen: {w: screen.width, h: screen.height, vw: innerWidth, vh: innerHeight, dpr: devicePixelRatio || 1}};
  if (q.get('kiosk')) body.kiosk = q.get('kiosk');
  if (mon >= 0 && mon <= 7) body.monitor = mon;
  try { await api('POST', '/api/v1/display/health', body); } catch (x) { /* the next report tries again */ }
}
function start() {
  try { lastCmd = +(sessionStorage.getItem('ctrl32.display.cmd') || 0); } catch (x) { /* ignore */ }
  poll();
  if (!healthT) { setTimeout(reportHealth, 15000); healthT = setInterval(reportHealth, 30000); }
}
let healthT = null;

// keep the screen on and the cursor away; the first click switches to full screen
async function wake() { try { if ('wakeLock' in navigator) (await navigator.wakeLock.request('screen')).addEventListener('release', () => setTimeout(wake, 1000)); } catch (x) { /* not allowed yet */ } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
document.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); wake(); });
let idle = null;
