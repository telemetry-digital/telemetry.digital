<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request an account</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e30613">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>.box { max-width: 440px; margin: 32px auto; } .box h1 { font-size: 1.2em; }</style>
</head>
<body>
<header class="topbar"></header>
<main class="container">
<form id="f" class="card box form">
  <h1>Request an account</h1>
  <p class="muted">Accounts are created by an administrator of this organization. Leave your details and they will get back to you.</p>
  <label>Full name <input name="full_name" required maxlength="128" autofocus autocomplete="name"></label>
  <label>E-mail <input name="email" type="email" required maxlength="254" autocomplete="email"></label>
  <label>Message <textarea name="message" maxlength="1000" rows="4" style="font-family:var(--font)"></textarea></label>
  <div class="err" id="err"></div>
  <button class="btn primary" type="submit">Send request</button>
  <div id="done" hidden class="muted">Thank you. An administrator will create your account.</div>
  <p style="text-align:center;font-size:14px;margin:4px 0 0"><a href="/login">Back to sign in</a></p>
</form>
</main>
<script src="/app.js"></script>
<script>
ctrl32.ready();
document.querySelector('#f').onsubmit = async e => { e.preventDefault(); const f = e.target; const err = document.querySelector('#err'); err.textContent='';
  try{ await ctrl32.api('POST','/api/v1/auth/register-request',{full_name: f.full_name.value, email: f.email.value, message: f.message.value}); f.querySelector('button').hidden = true; document.querySelector('#done').hidden = false; }
  catch(x){ err.textContent = x.message; } };
</script>
</body>
</html>
