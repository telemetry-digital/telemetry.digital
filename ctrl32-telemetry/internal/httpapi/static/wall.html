<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video wall</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="wall">
<main>
  <div class="wall-grid" id="grid"></div>
  <div class="wall-bar" id="bar">
    <b class="notranslate" id="wname"></b>
    <select id="screen" aria-label="Screen"></select>
    <span class="cam-layout" id="camLayout" role="group" aria-label="Layout"><button class="btn ghost small" type="button" data-layout="grid" title="Grid" aria-label="Grid"></button><button class="btn ghost small" type="button" data-layout="list" title="One camera per row" aria-label="One camera per row"></button></span>
    <button class="btn ghost small" type="button" id="fs">Full screen</button>
    <button class="btn ghost small" type="button" id="all">Open on all monitors</button>
    <a class="btn ghost small" href="/video/walls">Close</a>
    <span class="muted" style="font-size:11px">ctrl32 · telemetry</span>
  </div>
</main>
<script src="/app.js"></script>
<script src="/videoplayer.js"></script>
<script>
const $ = s => document.querySelector(s), esc = ctrl32.esc, api = ctrl32.api, t = ctrl32.t;
const ID = location.pathname.split('/').pop(), Q = new URLSearchParams(location.search);
let WALL = null, CAMS = {}, players = [], SCREEN = +(Q.get('screen') || 0), PLAY = false;

function render() {
  for (const p of players) p.close(); players = [];
  const sc = WALL.screens[SCREEN] || WALL.screens[0];
  document.title = `${WALL.name} · ${sc.name || t('Screen') + ' ' + (SCREEN + 1)}`;
  const g = $('#grid');
  g.style.gridTemplateColumns = `repeat(${sc.cols}, 1fr)`; g.style.gridTemplateRows = `repeat(${sc.rows}, 1fr)`;
  // tiles may span several cells (0.85.0); the placement is the server's (ctrl32Player.wallPlace)
  g.innerHTML = ctrl32Player.wallPlace(sc).map(r => {
    const c = r.id && CAMS[r.id];
    return `<div class="cell${r.w > 1 || r.h > 1 ? ' big' : ''}" data-i="${r.i}" style="${ctrl32Player.wallArea(r)}" ${c ? `data-id="${r.id}"` : ''}>${c ? `<div class="cap"><span class="cam-dot"></span><span class="notranslate">${esc(c.name)}</span></div>` : ''}</div>`;
  }).join('');
  // the screen's choice; automatic: the sub-stream for many tiles, the main stream for a few large ones
  const quality = sc.quality === 'main' || sc.quality === 'sub' ? sc.quality : sc.cols * sc.rows > (WALL.sub_stream_above ?? 4) ? 'sub' : 'main';
  for (const el of g.querySelectorAll('.cell[data-id]')) {
    const dotEl = el.querySelector('.cam-dot');
    const p = ctrl32Player(el, {url: `/api/v1/video/cameras/${el.dataset.id}/live?quality=${quality}`, live: true,
      onState: s => { dotEl.className = 'cam-dot ' + (s === 'online' ? 'online' : s === 'offline' ? 'offline' : ''); }});
    el.prepend(p.el); players.push(p);
    // a click enlarges the tile to the whole screen (main stream), another click or Esc returns (0.85.0: on every
    // wall); on a wall allowing playback the enlarged camera offers its recordings
    el.onclick = () => maximize(el);
    el.title = t('Click: enlarge');
  }
  $('#screen').innerHTML = WALL.screens.map((s, i) => `<option value="${i}"${i === SCREEN ? ' selected' : ''}>${esc(s.name || t('Screen') + ' ' + (i + 1))} (${s.cols}×${s.rows})</option>`).join('');
}
let big = null;
function maximize(el) {
  if (big) { big.p.close(); big.btn.remove(); big.el.classList.remove('max'); const was = big.el; big = null; if (was === el) return; }
  el.classList.add('max');
  const p = ctrl32Player(el, {url: `/api/v1/video/cameras/${el.dataset.id}/live?quality=main`, live: true});
  p.el.style.position = 'absolute'; p.el.style.inset = '0'; p.el.style.zIndex = '1';
  const btn = document.createElement('div'); btn.className = 'wall-max-bar';
  const c = CAMS[el.dataset.id];
  btn.innerHTML = `<span class="notranslate wall-max-name">${esc(c ? c.name : '')}</span>${PLAY ? `<button class="btn small" type="button" data-rec>${esc(t('Recordings'))}</button>` : ''}<button class="btn small" type="button" data-back>${esc(t('Back to the wall'))} (Esc)</button>`;
  btn.onclick = e => e.stopPropagation();
  const rec = btn.querySelector('[data-rec]'); if (rec) rec.onclick = () => playback(el.dataset.id);
  btn.querySelector('[data-back]').onclick = () => maximize(el);
  el.appendChild(btn);
  big = {el, p, btn};
}
// Playback from the wall (0.82.0): the camera page (live, timeline, recordings) in a layer over the wall; the tiles
// stop meanwhile (one decoder less per tile on the wall PC) and start again when the layer closes.
function playback(id) {
  if (big) maximize(big.el);
  for (const p of players) p.close(); players = [];
  const lay = document.createElement('div'); lay.className = 'wall-play'; lay.id = 'play';
  lay.innerHTML = `<iframe src="/video/cameras/${encodeURIComponent(id)}?embed=1" title="${esc(CAMS[id] ? CAMS[id].name : '')}"></iframe><button class="btn small" type="button" id="playClose">${esc(t('Back to the wall'))} (Esc)</button>`;
  document.body.appendChild(lay);
  const fr = lay.querySelector('iframe');
  fr.onload = () => { try { fr.contentWindow.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayback(); }); fr.contentWindow.focus(); } catch (e) { /* other origin */ } };
  $('#playClose').onclick = closePlayback;
}
function closePlayback() { const lay = $('#play'); if (!lay) return; lay.remove(); render(); }
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('#play')) closePlayback(); else if (big) maximize(big.el); });
// on a phone the tiles go below each other (one camera per row, scrolling); the same streams as in the grid
const LAYOUT = ctrl32Player.layout;
function applyLayout() {
  const m = LAYOUT.mode();
  document.body.classList.toggle('wall-list', m === 'list');
  for (const b of document.querySelectorAll('#camLayout [data-layout]')) { b.classList.toggle('on', b.dataset.layout === m); b.setAttribute('aria-pressed', String(b.dataset.layout === m)); }
}
for (const b of document.querySelectorAll('#camLayout [data-layout]')) { b.innerHTML = LAYOUT.icons[b.dataset.layout]; b.onclick = (e) => { e.stopPropagation(); LAYOUT.set(b.dataset.layout); applyLayout(); }; }
addEventListener('resize', applyLayout);
applyLayout();
$('#screen').onchange = e => { SCREEN = +e.target.value; const u = new URL(location.href); u.searchParams.set('screen', SCREEN); history.replaceState(null, '', u); render(); };
$('#fs').onclick = () => ctrl32.fullscreen(document.documentElement);
$('#all').onclick = async () => {
  let screens = null;
  try { if ('getScreenDetails' in window) screens = (await window.getScreenDetails()).screens; } catch (e) { screens = null; }
  WALL.screens.forEach((s, i) => {
    if (i === SCREEN) return;
    const m = screens && screens[i % screens.length];
    window.open(`/video/walls/${ID}?screen=${i}&auto=1`, 'ctrl32wall' + ID + '-' + i, m ? `popup,left=${m.availLeft},top=${m.availTop},width=${m.availWidth},height=${m.availHeight}` : '');
  });
};
// the toolbar hides after a few seconds without mouse movement
let idle = null;
function wake() { $('#bar').classList.remove('idle'); document.body.style.cursor = ''; clearTimeout(idle); idle = setTimeout(() => { $('#bar').classList.add('idle'); document.body.style.cursor = 'none'; }, 3000); }
document.addEventListener('mousemove', wake); document.addEventListener('touchstart', wake);
ctrl32.ready({requireAuth: true, requirePerm: 'video.view'}).then(async ({me}) => {
  try {
    const [w, cams] = await Promise.all([api('GET', '/api/v1/video/walls/' + ID), api('GET', '/api/v1/video/cameras')]);
    WALL = w; for (const c of cams) CAMS[c.id] = c;
  } catch (x) { $('#grid').innerHTML = `<div class="vp-msg">${esc(x.message)}</div>`; return; }
  $('#wname').textContent = WALL.name;
  PLAY = !!WALL.playback_on_click && !!(me && (me.permissions || []).includes('video.playback'));
  applyLayout(); // the app profile is known now
  render(); wake();
  // cameras reporting motion or other events are outlined
  setInterval(async () => {
    if (document.hidden || $('#play')) return;
    try { for (const c of await api('GET', '/api/v1/video/cameras')) for (const el of document.querySelectorAll(`.cell[data-id="${c.id}"]`)) {
      const a = c.status.active || []; el.classList.toggle('cam-alert', a.length > 0); el.dataset.active = a.map(k => t(k)).join(', '); } } catch (x) { /* next time */ }
  }, 3000);
  // after a server update the wall reloads itself (new page and scripts), 0–30 s later and only while nobody is looking
  // at an enlarged camera or a recording; at most once in 10 minutes per tab (0.85.1)
  let serverVersion = null, updateT = null;
  const checkVersion = async () => {
    let v = null;
    try { v = (await (await fetch('/healthz', {cache: 'no-store'})).json()).version; } catch (x) { return; }
    if (!v) return;
    if (serverVersion === null) { serverVersion = v; return; }
    if (v === serverVersion || updateT) return;
    let last = 0;
    try { last = +(sessionStorage.getItem('ctrl32.wall.updated') || 0); } catch (x) { /* ignore */ }
    if (Date.now() - last < 10 * 60 * 1000) return;
    const go = () => { if ($('#play') || big) { updateT = setTimeout(go, 30000); return; } try { sessionStorage.setItem('ctrl32.wall.updated', String(Date.now())); } catch (x) { /* ignore */ } location.reload(); };
    updateT = setTimeout(go, Math.random() * 30000);
  };
  checkVersion(); setInterval(checkVersion, 60000);
  // opened by "Open on all monitors": the first click anywhere switches this window to full screen
  if (Q.get('auto')) document.addEventListener('click', () => { if (!ctrl32.isFullscreen()) ctrl32.fullscreen(document.documentElement); }, {once: true, capture: true});
});
</script>
</body>
</html>
