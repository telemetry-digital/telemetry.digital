<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set a new password</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e30613">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>.box { max-width: 400px; margin: 32px auto; } .box h1 { font-size: 1.2em; }</style>
</head>
<body>
<header class="topbar"></header>
<main class="container">
<form id="f" class="card box form">
  <h1>Set a new password</h1>
  <label>New password <input name="password" type="password" required minlength="12" autocomplete="new-password" autofocus></label>
  <label>Repeat password <input name="password2" type="password" required minlength="12" autocomplete="new-password"></label>
  <div class="muted">At least 12 characters, three character classes.</div>
  <div class="err" id="err"></div>
  <button class="btn primary" type="submit">Save password</button>
</form>
</main>
<script src="/app.js"></script>
<script>
ctrl32.ready();
const token = new URLSearchParams(location.search).get('token') || '';
if(!token) document.querySelector('#err').textContent = 'The link is incomplete. Open it exactly as it was sent.';
document.querySelector('#f').onsubmit = async e => { e.preventDefault(); const f = e.target; const err = document.querySelector('#err'); err.textContent='';
  if(f.password.value !== f.password2.value){ err.textContent = 'the passwords differ'; return; }
  try{ await ctrl32.api('POST','/api/v1/auth/reset',{token, password: f.password.value}); location.href = '/login?reset=1'; }catch(x){ err.textContent = x.message; } };
</script>
</body>
</html>
