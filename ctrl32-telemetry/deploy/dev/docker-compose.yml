# Development database for ctrl32 telemetry. Not for production. Normally started by deploy/dev/dev.sh up.
# Usage:  docker compose -f deploy/dev/docker-compose.yml up -d
#         (the server applies the migrations: ctrl32-telemetry migrate)
services:
  postgres:
    image: postgres:18
    container_name: ctrl32-pg-dev
    environment:
      POSTGRES_USER: ctrl32
      POSTGRES_PASSWORD: ctrl32-dev-only
      POSTGRES_DB: ctrl32
    ports:
      - "5433:5432"
    volumes:
      - ctrl32-pg-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctrl32 -d ctrl32"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ctrl32-pg-dev:
